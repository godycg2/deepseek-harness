name: Build macOS Intel DMG (unsigned)

# 手动触发：在 Actions 页面选择本工作流，点击 Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只允许一个构建，新的请求排队而不是取消正在进行的构建
concurrency:
  group: macos-x64-unsigned
  cancel-in-progress: false

jobs:
  package:
    # GitHub 托管的原生 Intel (x86_64) macOS runner
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        # pnpm 版本自动从 package.json 的 "packageManager": "pnpm@11.28.5" 读取，无需手动指定

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Show toolchain versions
        run: |
          node --version
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned macOS Intel (x64) DMG
        run: pnpm run package:desktop:mac:x64:unsigned

      - name: List build output
        run: ls -la "apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-mac-x64-unsigned
          path: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*
          retention-days: 14
          if-no-files-found: error
